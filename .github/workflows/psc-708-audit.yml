name: PSC lambda 7.08 certified audit

on:
  pull_request:
    branches: [research-lab-agents]
  workflow_dispatch:

jobs:
  rectangle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lambda708-512
            prec: 512
            lam0: '7.08'
            lam1: '7.10'
            depth: 10
          - label: lambda708-768
            prec: 768
            lam0: '7.08'
            lam1: '7.10'
            depth: 10
          - label: lambda706-diagnostic-512
            prec: 512
            lam0: '7.06'
            lam1: '7.08'
            depth: 10
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc-708-audit-run
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Compile canonical rectangular PSC verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} \
            research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c \
            -lmpfr -lgmp -o psc_box
      - name: Run adaptive certified cover
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./psc_box 0.01 0.5 ${{ matrix.lam0 }} ${{ matrix.lam1 }} \
            ${{ matrix.depth }} 128 ${{ matrix.label }} 4
      - name: Record source hashes
        if: always()
        run: |
          sha256sum research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            > ${{ matrix.label }}_source_sha256.txt
      - name: Upload rectangle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ matrix.label }}_summary.json
            ${{ matrix.label }}_unresolved.csv
            ${{ matrix.label }}_certified.csv
            ${{ matrix.label }}_source_sha256.txt

  small-time:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: psc-708-audit-run
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Compile and run small-time audit
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} \
            research_lab/certificates/low_shoulder/small_time_lambda708_audit.c \
            -lmpfr -lgmp -o small708
          ./small708 | tee small_time_lambda708_audit_${{ matrix.prec }}.txt
          sha256sum research_lab/certificates/low_shoulder/small_time_lambda708_audit.c \
            > small_time_lambda708_source_${{ matrix.prec }}_sha256.txt
      - name: Upload small-time artifact
        uses: actions/upload-artifact@v4
        with:
          name: small-time-708-${{ matrix.prec }}
          path: |
            small_time_lambda708_audit_${{ matrix.prec }}.txt
            small_time_lambda708_source_${{ matrix.prec }}_sha256.txt
