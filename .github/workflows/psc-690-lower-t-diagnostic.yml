name: PSC lambda 6.90 lower-t diagnostic

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/psc-690-lower-t-diagnostic.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Compile PSC verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} \
            research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c \
            -lmpfr -lgmp -o psc_box
      - name: Run adaptive lower-t diagnostic
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./psc_box 0.01 0.45 6.90 7.08 10 128 psc690-lowt-${{ matrix.prec }} 8
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psc690-lowt-${{ matrix.prec }}
          path: |
            psc690-lowt-${{ matrix.prec }}_summary.json
            psc690-lowt-${{ matrix.prec }}_unresolved.csv
            psc690-lowt-${{ matrix.prec }}_certified.csv
