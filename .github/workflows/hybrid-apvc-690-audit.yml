name: Hybrid PSC APVC lambda 6.90 audit

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/hybrid-apvc-690-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Generate hybrid source
        run: python research_lab/certificates/low_shoulder/make_hybrid_apvc_verifier.py
      - name: Compile hybrid verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} \
            research_lab/certificates/low_shoulder/hybrid_psc_apvc_box_mpfr.c \
            -lmpfr -lgmp -o hybrid_box
      - name: Run adaptive cover
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./hybrid_box 0.01 0.5 6.90 7.08 11 128 hybrid690-${{ matrix.prec }} 8
      - name: Record source hashes
        if: always()
        run: |
          sha256sum research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/make_hybrid_apvc_verifier.py \
                    research_lab/certificates/low_shoulder/hybrid_psc_apvc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            > hybrid690-${{ matrix.prec }}_source_sha256.txt || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid690-${{ matrix.prec }}
          path: |
            hybrid690-${{ matrix.prec }}_summary.json
            hybrid690-${{ matrix.prec }}_unresolved.csv
            hybrid690-${{ matrix.prec }}_certified.csv
            hybrid690-${{ matrix.prec }}_source_sha256.txt
            research_lab/certificates/low_shoulder/hybrid_psc_apvc_box_mpfr.c
