name: Unified Collision Geometry Lab — STATIC ONLY

on:
  workflow_dispatch:

jobs:
  validate-research-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout focused research branch
        uses: actions/checkout@v4
        with:
          ref: research-lab-agents

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static validation only — no AI/API calls
        run: |
          python -m py_compile research_lab/collision_lab.py research_lab/roles.py
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('research_lab/knowledge/unified_collision_geometry_program.md'),
              Path('research_lab/knowledge/current_collision_program_state.md'),
              Path('research_lab/runs/2026-08-15_round12_local_collision_divisor.md'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'Missing required research files: {missing}')
          print('Research lab static integrity check passed. No external model was called.')
          PY
