name: Strict JECC lambda 6.50 768-bit audit

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/strict-jecc-650-768.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Generate Round-80 verifier
        run: python research_lab/certificates/low_shoulder/make_joint_ellipse_verifier.py
      - name: Compile 768-bit verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=768 research_lab/certificates/low_shoulder/joint_ellipse_psc_box_mpfr.c -lmpfr -lgmp -o jecc_box
      - name: Run full compact audit
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./jecc_box 0.01 0.50 6.50 6.83 10 128 jecc650-768 8
      - name: Record hashes
        if: always()
        run: |
          sha256sum research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/make_joint_ellipse_verifier.py \
                    research_lab/certificates/low_shoulder/joint_ellipse_psc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            > jecc650-768_source_sha256.txt || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jecc650-768
          path: |
            jecc650-768_summary.json
            jecc650-768_unresolved.csv
            jecc650-768_certified.csv
            jecc650-768_source_sha256.txt
