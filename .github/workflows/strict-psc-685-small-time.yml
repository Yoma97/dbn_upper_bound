name: Strict PSC lambda 6.85 small-time audit

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/strict-psc-685-small-time.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Compile verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} \
            research_lab/certificates/low_shoulder/small_time_lambda685_audit.c \
            -lmpfr -lgmp -o small685
      - name: Run directed audit
        run: ./small685 | tee strict_small_time_lambda685_${{ matrix.prec }}.txt
      - name: Hash source
        if: always()
        run: sha256sum research_lab/certificates/low_shoulder/small_time_lambda685_audit.c > strict_small_time_lambda685_source_${{ matrix.prec }}.sha256
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-small685-${{ matrix.prec }}
          path: |
            strict_small_time_lambda685_${{ matrix.prec }}.txt
            strict_small_time_lambda685_source_${{ matrix.prec }}.sha256
