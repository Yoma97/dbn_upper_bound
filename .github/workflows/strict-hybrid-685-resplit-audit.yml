name: Strict resplit PSC APVC lambda 6.85 audit

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/strict-hybrid-685-resplit-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
        region: [low, high]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Generate strict hybrid source
        run: |
          python research_lab/certificates/low_shoulder/make_hybrid_apvc_verifier.py
          python research_lab/certificates/low_shoulder/soften_hybrid_apvc.py
          python research_lab/certificates/low_shoulder/lower_apvc_activation.py
      - name: Compile verifiers
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c -lmpfr -lgmp -o psc_box
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} research_lab/certificates/low_shoulder/hybrid_psc_apvc_box_mpfr.c -lmpfr -lgmp -o hybrid_box
      - name: Run lower PSC cover
        if: matrix.region == 'low'
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./psc_box 0.01 0.39 6.85 6.90 11 128 strict685r-low-${{ matrix.prec }} 8
      - name: Run upper hybrid cover
        if: matrix.region == 'high'
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./hybrid_box 0.39 0.50 6.85 6.90 11 768 strict685r-high-${{ matrix.prec }} 8
      - name: Record source hashes
        if: always()
        run: |
          sha256sum research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/make_hybrid_apvc_verifier.py \
                    research_lab/certificates/low_shoulder/soften_hybrid_apvc.py \
                    research_lab/certificates/low_shoulder/lower_apvc_activation.py \
                    research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            > strict685r-${{ matrix.region }}-${{ matrix.prec }}_source_sha256.txt || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict685r-${{ matrix.region }}-${{ matrix.prec }}
          path: |
            strict685r-${{ matrix.region }}-${{ matrix.prec }}_summary.json
            strict685r-${{ matrix.region }}-${{ matrix.prec }}_unresolved.csv
            strict685r-${{ matrix.region }}-${{ matrix.prec }}_certified.csv
            strict685r-${{ matrix.region }}-${{ matrix.prec }}_source_sha256.txt
