name: Strict JECC lambda 6.50 to 7.08 audit

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/strict-jecc-650-to708-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Generate Round-80 verifier
        run: python research_lab/certificates/low_shoulder/make_joint_ellipse_verifier.py
      - name: Compile verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} \
            research_lab/certificates/low_shoulder/joint_ellipse_psc_box_mpfr.c \
            -lmpfr -lgmp -o jecc_box
      - name: Run unified compact bridge
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./jecc_box 0.01 0.50 6.50 7.08 10 128 jecc650to708-${{ matrix.prec }} 8
      - name: Record source hashes
        if: always()
        run: |
          sha256sum research_lab/certificates/low_shoulder/convex_tail_psc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/make_joint_ellipse_verifier.py \
                    research_lab/certificates/low_shoulder/joint_ellipse_psc_box_mpfr.c \
                    research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            > jecc650to708-${{ matrix.prec }}_source_sha256.txt || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jecc650to708-${{ matrix.prec }}
          path: |
            jecc650to708-${{ matrix.prec }}_summary.json
            jecc650to708-${{ matrix.prec }}_unresolved.csv
            jecc650to708-${{ matrix.prec }}_certified.csv
            jecc650to708-${{ matrix.prec }}_source_sha256.txt
