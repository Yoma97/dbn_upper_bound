name: High-time soft APVC lambda 6.90 K512

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/hybrid-apvc-soft-690-high-k512.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Generate soft hybrid source
        run: |
          python research_lab/certificates/low_shoulder/make_hybrid_apvc_verifier.py
          python research_lab/certificates/low_shoulder/soften_hybrid_apvc.py
      - name: Compile hybrid verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} \
            research_lab/certificates/low_shoulder/hybrid_psc_apvc_box_mpfr.c \
            -lmpfr -lgmp -o hybrid_box
      - name: Run high-time cover with K512
        run: |
          python research_lab/certificates/low_shoulder/adaptive_psc_lambda_tiler.py \
            ./hybrid_box 0.40 0.50 6.90 7.08 9 512 high690-k512-${{ matrix.prec }} 8
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high690-k512-${{ matrix.prec }}
          path: |
            high690-k512-${{ matrix.prec }}_summary.json
            high690-k512-${{ matrix.prec }}_unresolved.csv
            high690-k512-${{ matrix.prec }}_certified.csv
