name: Strict PSC lambda 6.50 small-time audit

on:
  push:
    branches: [research-lab-agents]
    paths:
      - '.github/workflows/strict-psc-650-small-time.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        prec: [512, 768]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-lab-agents
      - name: Install MPFR/GMP
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Compile verifier
        run: |
          cc -O2 -Wall -Wextra -DPREC=${{ matrix.prec }} research_lab/certificates/low_shoulder/small_time_lambda650_audit.c -lmpfr -lgmp -o small650
      - name: Run directed audit
        run: ./small650 | tee strict_small_time_lambda650_${{ matrix.prec }}.txt
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-small650-${{ matrix.prec }}
          path: strict_small_time_lambda650_${{ matrix.prec }}.txt
