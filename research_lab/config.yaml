mission:
  name: "Riemann Mathematical Invention Lab"
  primary_target: >-
    Treat the Riemann Hypothesis as an open research problem. Starting only from
    verified frontier results, identify the smallest non-circular intermediate
    theorem or genuinely new mathematical structure that removes a documented
    obstruction and could force critical-line rigidity. Do not privilege any
    single route (heat flow, spectral, Weil/Li, Laguerre, pair correlation, etc.)
    unless the current evidence justifies it.
  success_condition: >-
    Either (i) a completely certified new theorem that closes a documented
    intermediate obstruction without assuming RH-equivalent strength, or
    (ii) a rigorously proved new mathematical tool/theory with non-RH scope that
    materially reduces such an obstruction. RH itself is not to be claimed
    solved unless every dependency edge is independently certified.

runtime:
  default_orchestrator: "orchestrator_v3.py"
  default_model: "gpt-5.6-sol"
  responses_api_required_for_max_reasoning: true

reasoning_policy:
  frontier_curator: high
  invention_default: high
  obstruction_analyst: xhigh
  constraint_hunter: xhigh
  violation_amplifier: xhigh
  identity_invariant_hunter: xhigh
  bridge_builder: xhigh
  theory_builder: xhigh
  synthesis: xhigh
  destroyer: max
  equivalence_auditor: max
  mathematical_legitimacy_auditor: max
  exclusion_completeness_auditor: max
  independent_referee: max
  proof_reconstructors: max

execution:
  independent_invention_rounds: 5
  candidates_per_inventor: 3
  max_promoted_candidates_per_round: 4
  blind_first_round: true
  require_fresh_context_referee: true
  require_independent_proof_reconstruction: true
  require_second_independent_reconstruction_for_theorem: true
  require_structured_outputs: true
  freeze_claim_before_certification: true
  one_new_lemma_rule: true
  reject_multi_gap_chains: true
  dead_end_requires_material_delta_to_reopen: true
  falsification_before_proof_reconstruction: true

claim_hygiene:
  atomic_claims_only: true
  explicit_quantifiers: true
  explicit_domains_and_parameter_ranges: true
  explicit_uniformity_for_asymptotics: true
  explicit_normalization_and_conventions: true
  separate_correctness_from_novelty: true
  separate_equivalence_from_progress: true
  separate_numerical_support_from_proof: true
  require_dependency_dag: true
  require_assumption_ledger: true
  require_fast_falsification_test: true
  require_edge_case_matrix: true
  require_structured_numerical_requests: true

statuses:
  truth:
    - IDEA
    - CANDIDATE
    - INTERNALLY_PROVED
    - INDEPENDENTLY_RECONSTRUCTED
    - REFEREE_VERIFIED
    - REFUTED
  novelty:
    - NOT_ASSESSED
    - NOVELTY_UNVERIFIED
    - KNOWN_OR_SUBSUMED
    - PLAUSIBLY_NEW
    - LITERATURE_AUDITED
  relevance:
    - REFORMULATION_ONLY
    - DIAGNOSTIC_TOOL
    - INTERMEDIATE_LEMMA
    - FRONTIER_ADVANCE
    - GENERAL_NEW_TOOL

promotion_gates:
  CANDIDATE:
    - precise_atomic_statement
    - explicit_quantifiers
    - explicit_hypotheses
    - convention_lock
    - explicit_target_connection
    - nontriviality_check
    - fastest_falsification_test
  INTERNALLY_PROVED:
    - complete_proof
    - dependency_dag
    - assumption_ledger
    - edge_case_audit
    - no_numerical_step_used_as_infinite_proof
    - no_unresolved_gap
  REFEREE_VERIFIED:
    - two_independent_proof_reconstructions
    - adversarial_referee_pass
    - circularity_audit_pass
    - counterexample_attack_pass
    - dependency_verification_pass
    - convention_and_normalization_audit_pass
  GENERAL_NEW_TOOL:
    - referee_verified_truth
    - abstract_definition
    - scope_beyond_riemann
    - independent_non_rh_theorem_or_application
    - novelty_literature_audit

proof_discipline:
  one_new_lemma_rule: >-
    A proposed implication chain may contain at most one genuinely new unproved
    lemma at a time. If two independent new lemmas are required, split the
    project and prove the earlier one first.
  gap_budget: 0
  proof_reconstruction: >-
    Independent reconstructors receive only the frozen statement, definitions,
    allowed dependencies and conventions, not the author's proof text.
  failed_candidate_policy: >-
    A refuted/failing claim is frozen. A repaired version receives a new claim ID
    and must state the exact mathematical delta that addresses the failure.

edge_case_matrix:
  required:
    - lowest_degree_toy_models
    - symmetry_preserving_fake_xi_models
    - multiple_zero_models
    - even_and_odd_collision_multiplicity
    - t_to_0_and_boundary_time_limits
    - x_to_infinity_or_height_to_infinity
    - parameters_to_endpoint
    - sparse_exception_regime
    - cancellation_between_symmetry_partners
    - scaling_and_normalization_changes

arb:
  protocol_file: "knowledge/arb_verification_protocol.md"
  hard_fail_on_missing_rigorous_capability: true
  connected_capabilities:
    - sqrt
    - riemann_zeta
    - zeta_zero
  desired_server_extensions:
    - xi
    - xi_derivative
    - H_t
    - H_t_derivative
    - laguerre
    - interval_integral
    - interval_extremum
    - matrix_inertia
    - interval_newton
  finite_computation_can_prove_global_claim_only_after_analytic_reduction: true

numerics:
  role:
    - refute_false_conjectures
    - discover_patterns
    - rigorously_certify_finite_subproblems
    - verify_symbolic_identities_on_independent_test_families
  forbidden:
    - infer_global_truth_from_large_finite_sampling
    - promote_any_claim_to_proved_from_floating_point_only
    - replace_uniform_estimates_with_grid_checks
    - substitute_floating_point_for_missing_arb_capability

research_preferences:
  reward:
    exact_identity: 10
    monotonicity_or_invariant: 10
    structural_noncollision_principle: 10
    new_general_theorem: 10
    bridge_between_fields: 9
    independently_useful_definition: 8
    reduction_to_one_new_lemma: 10
    falsifiable_statement: 8
  penalize:
    hidden_RH_equivalence: 100
    circular_reasoning: 100
    numerical_only_argument: 100
    rephrasing_known_result: 30
    multiple_independent_unproved_lemmas: 40
    ambiguous_quantifiers_or_uniformity: 40
    convention_or_normalization_drift: 40
    missing_rigorous_numerical_capability_hidden_by_floats: 100
    constant_improvement_without_threshold_crossing: 15
    long_argument_without_new_mechanism: 10
