as_of: 2026-08-14

trust_policy:
  tier_A:
    meaning: "Published/accepted mathematics or official status; may seed KNOWN claims, subject to exact-hypothesis checking."
  tier_B:
    meaning: "Serious current preprint by established researchers; may seed FRONTIER claims but must be independently reconstructed before promotion."
  tier_C:
    meaning: "Very recent/unreviewed preprint or record package; mine for ideas only until independently audited."
  tier_D:
    meaning: "Unverified, unclear-provenance, self-published, or extraordinary claim; never use as a theorem. Counterexample/idea mining only."

