as_of: 2026-08-16

trust_policy:
  tier_A:
    meaning: "Published/accepted mathematics or official status; may seed KNOWN claims, subject to exact-hypothesis checking."
  tier_B:
    meaning: "Serious current preprint by established researchers; may seed FRONTIER claims but must be independently reconstructed before promotion."
  tier_C:
    meaning: "Very recent/unreviewed preprint or record package; mine for ideas only until independently audited."
  tier_D:
    meaning: "Unverified, unclear-provenance, self-published, or extraordinary claim; never use as a theorem. Counterexample/idea mining only."

sources:
  - id: clay_rh_status
    tier: A
    type: official
    result: "RH remains an unsolved Millennium Prize Problem."
    locator: "Clay Mathematics Institute, Riemann Hypothesis / Millennium Prize Problems"

  - id: przz_2018_2020
    tier: A
    type: published
    arxiv: "1802.10521"
    result: "Slightly more than 5/12 of zeta zeros are on the critical line unconditionally."

  - id: platt_trudgian_2021
    tier: A
    type: published
    arxiv: "2004.09765"
    result: "Rigorous interval-arithmetic verification of RH up to height 3*10^12."
    restriction: "Finite-height verification only."

  - id: rodgers_tao
    tier: A
    type: published
    arxiv: "1801.05914"
    result: "de Bruijn-Newman constant Lambda >= 0."

  - id: polymath_dbn
    tier: A
    type: published
    arxiv: "1904.12438"
    result: "Lambda <= 0.22 via effective heat-flow estimates, numerical verification, and barrier method."

  - id: bourgain_zeta_subconvexity
    tier: A
    type: published
    arxiv: "1408.5794"
    journal: "Journal of the American Mathematical Society 30 (2017), 205-224"
    doi: "10.1090/jams/860"
    result: "Critical-line subconvexity |zeta(1/2+it)| <<_epsilon t^(13/84+epsilon)."
    restriction: "Pointwise critical-line growth input only. Round 44 shows that fixed interior-strip pointwise improvements cannot improve the current collision gate while this endpoint exponent remains unchanged."

  - id: yang_interior_zeta_bounds
    tier: B
    type: current_preprint
    arxiv: "2301.03165"
    result: "For every integer k>=4, at sigma_k=1-k/(2^k-2), |zeta(sigma_k+it)| <= 1.546 t^(1/(2^k-2)) log t for t>=3; these lines sharpen ordinary interpolation inside the strip."
    restriction: "Interior pointwise input only. Round 44 proves that these sharper anchors do not move the endpoint-dominated lambda gate unless the critical-line exponent itself is improved or pointwise control is replaced by genuinely new arithmetic cancellation."

  - id: li_positivity_1997
    tier: A
    type: published
    journal: "Journal of Number Theory 65 (1997), 325-333"
    doi: "10.1006/jnth.1997.2137"
    result: "RH is equivalent to nonnegativity of the Li coefficient sequence."
    restriction: "Endpoint-equivalent criterion; not progress unless positivity is proved by an independent mechanism."

  - id: bombieri_lagarias_li_1999
    tier: A
    type: published
    journal: "Journal of Number Theory 77 (1999), 274-287"
    doi: "10.1006/jnth.1999.2392"
    result: "Li's criterion follows from general inequalities for multisets of complex numbers; Li positivity is related through the Guinand-Weil explicit formula to Weil's RH positivity criterion."
    restriction: "Use as a structural template for no-go laws and violation amplification, not as a free proof of positivity."

  - id: lagarias_xi_positivity_1999
    tier: A
    type: published
    journal: "Acta Arithmetica 89 (1999), 217-234"
    doi: "10.4064/aa-89-3-217-234"
    result: "Develops positivity properties and criteria associated with the Riemann xi function."

  - id: voros_li_asymptotic_2006
    tier: A
    type: published
    arxiv: "math/0506326"
    journal: "Mathematical Physics, Analysis and Geometry 9 (2006), 53-63"
    result: "Under RH, Li coefficients have tempered n(A log n+B)-type asymptotics; if RH is false, their asymptotic behavior is non-tempered and oscillatory."
    restriction: "A model of violation amplification, not an independent proof of Li positivity."

  - id: suzuki_screw_2023
    tier: A
    type: published
    arxiv: "2206.03682"
    journal: "Journal of the London Mathematical Society (2023)"
    doi: "10.1112/jlms.12785"
    result: "Develops the zeta screw function and RH-equivalent positivity/moment/Hankel determinant conditions; under RH-false scenarios obtains associated degeneracy identities."
    restriction: "Moment/Hankel positivity is endpoint-equivalent unless an independent source of positivity is found."

  - id: conrey_li_debranges_difficulty
    tier: B
    type: historical_preprint
    arxiv: "math/9812166"
    result: "Examines de Branges positivity approaches and identifies their difficulty."
    restriction: "Use as an anti-tautology warning when proposing positivity from de Branges-type structures."

  - id: connes_consani_weil_trace
    tier: B
    type: research_preprint
    arxiv: "2006.13771"
    result: "Provides a conceptual trace-formula source for positivity of the archimedean Weil functional and develops machinery intended for the semilocal setting."
    restriction: "Do not infer full Weil positivity/RH from the archimedean case. Mine the compression/trace/Toeplitz mechanism for independent positivity ideas."

  - id: suzuki_weil_screw_2026
    tier: C
    type: very_recent_preprint
