    result: "Recasts Weil's quadratic form through the screw function without assuming RH and formulates a self-adjoint operator limit conjecture related to zero ordinates."
    restriction: "Very recent; use for mechanism generation and independently check any crucial theorem before promotion."

  - id: function_field_weil_model
